<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External</title>
    <style>
        .card{
            border-radius: 6px;
            box-shadow: 0px 4px 4px grey;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        body{
            background-color: rgb(223, 223, 223);
            display: flex;
            justify-content: center;
            margin-top: 30%;
        }
        input{
            width: 100px;
        }
        button{
            background-color: rgb(46, 60, 255);
            cursor: pointer;
            border: none;
            color: white;
            border-radius: 3px;
        }
        button:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reverse</h2>
        <div>
        <label>Enter a number: </label>
        <input type="number" id="input"/>
        </div>
        <br>
        <button onclick="calculate()">Calculate</button>
        <br>
        <div id="output"></div>
    </div>
    <script>
        function  calculate(){
            let n = document.getElementById("input").value;
            let rev = 0;
            while(n > 0){
                rev = (rev * 10) + (n % 10);
                n = Math.floor(n / 10);
            }
            document.getElementById("output").innerHTML= "<h4>Reversed number: " + rev  + "</h4>";
        }
    </script>
    
</body>
</html>
